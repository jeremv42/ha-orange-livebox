[project]
name = "ha-orange-livebox"
version = "0.1.0"
description = "Home Assistant custom integration for Orange Livebox routers"
requires-python = ">=3.14"
license = "MIT"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP", "SIM", "RUF", "D", "PL", "ASYNC"]
ignore = ["D202", "D203", "D213", "E501", "PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "PLR"]
"scripts/*" = ["D", "PLR"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components", "homeassistant"]
combine-as-imports = true
